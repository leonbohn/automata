[package]
name = "automata"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
readme = "README.md"
description = "A library for transition systems and automata over (in)finite words."
repository = "https://github.com/leonbohn/automata"
homepage = "https://github.com/leonbohn/automata"
license = "MIT"
authors = ["León Bohn <bohn@lics.rwth-aachen.de>"]
keywords = ["transition-system", "language", "hoa", "automata", "omega-automata"]
categories = ["mathematics", "science"]
exclude = [".github", "scripts", "CLAUDE.md", "PLAN.md"]

[dependencies]
tracing = "0.1"
biodivine-lib-bdd = "0.6"
itertools = "0.15"
indexmap = "2.7"
bimap = "0.6"
rand = "0.8.5"
thiserror = "2.0"
tabled = { version = "0.16", features = ["ansi"] }

hoars = { version = "0.3", optional = true }

layout-rs = { version = "0.1.2", optional = true }
open = { version = "5.3.2", optional = true }
base64 = { version = "0.23", optional = true }
resvg = { version = "0.49", optional = true }
usvg = { version = "0.49", optional = true, features = ["text", "system-fonts"] }

owo-colors = "4.2"
tempfile = { version = "3.17", optional = true }
bit-set = "0.11"
rand_distr = { version = "0.6", optional = true }

[dev-dependencies]
test-log = { version = "0.2", features = ["trace"] }

[features]
default = ["hoa"]
random = ["dep:rand_distr"]
hoa = ["dep:hoars"]
graphviz = ["dep:tempfile", "dep:open", "dep:base64"]
render = ["dep:layout-rs", "dep:base64", "dep:resvg", "dep:open", "dep:tempfile", "dep:usvg"]

[package.metadata.docs.rs]
all-features = true

[[example]]
name = "hoa"
required-features = ["hoa"]

